<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALDIA - Iniciar Sesión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrapper { width: 100%; max-width: 400px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 40px 32px; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h2 { font-size: 24px; font-weight: 800; }
    .logo p { color: #64748b; font-size: 13px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: border-color .2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    input.code { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 8px; font-family: monospace; }
    .btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-outline { background: transparent; color: #334155; border: 1px solid #cbd5e1; }
    .btn-outline:hover:not(:disabled) { background: #f8fafc; }
    .text-center { text-align: center; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 16px; }
    .small { font-size: 13px; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    .hidden { display: none; }
    .flex-col { display: flex; flex-direction: column; gap: 8px; }
    a { color: #2563eb; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .icon-box { background: #eff6ff; display: inline-flex; padding: 12px; border-radius: 12px; margin-bottom: 8px; }
    .icon-box svg { width: 28px; height: 28px; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .section-subtitle { color: #64748b; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo">
        <svg width="72" height="72" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 16px">
          <rect x="14" y="58" width="6" height="22" rx="3" fill="#3399ff" opacity="0.35"/>
          <rect x="24" y="48" width="6" height="32" rx="3" fill="#3399ff" opacity="0.53"/>
          <rect x="34" y="36" width="6" height="44" rx="3" fill="#3399ff" opacity="0.71"/>
          <rect x="44" y="22" width="6" height="58" rx="3" fill="#3399ff" opacity="0.89"/>
          <path d="M54 22 L74 22 C79 22 83 26 83 31 L83 51 C83 56 79 60 74 60 L64 60" fill="none" stroke="#3399ff" stroke-width="7" stroke-linecap="round"/>
          <rect x="14" y="80" width="42" height="4" rx="2" fill="#3399ff"/>
        </svg>
        <h2>ALDIA</h2>
        <p>Panel de administración</p>
      </div>

      <!-- LOGIN VIEW -->
      <div id="view-login">
        <p id="loginSuccessMsg" class="success small text-center mb-2 hidden"></p>
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="admin@aldia.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">Ingresar</button>
          <p id="loginError" class="error small text-center mt-2 hidden"></p>
        </form>
        <div class="flex-col mt-3">
          <button class="btn btn-outline" id="showForgotBtn">¿Olvidaste tu contraseña?</button>
        </div>
        <p class="text-center small mt-3" style="color:#94a3b8">¿No tenés cuenta? <a href="registro.html">Registrarse</a></p>
      </div>

      <!-- FORGOT VIEW (send code) -->
      <div id="view-forgot" class="hidden">
        <div class="text-center">
          <div class="icon-box">
            <svg fill="none" viewBox="0 0 24 24" stroke="#2563eb" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
          </div>
          <p class="section-title">Restablecer contraseña</p>
          <p class="section-subtitle">Ingresá tu email y te enviaremos un código de verificación.</p>
        </div>
        <form id="forgotForm">
          <div class="form-group">
            <input type="email" id="forgotEmail" placeholder="tu@email.com" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary" id="forgotBtn">Enviar código</button>
          <p id="forgotSuccess" class="success small text-center mt-2 hidden"></p>
          <p id="forgotError" class="error small text-center mt-2 hidden"></p>
        </form>
        <button class="btn btn-outline mt-3" id="forgotBackBtn">Volver al inicio</button>
      </div>

      <!-- 2FA VIEW -->
      <div id="view-2fa" class="hidden">
        <div class="text-center">
          <div class="icon-box">
            <svg fill="none" viewBox="0 0 24 24" stroke="#2563eb" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
          </div>
          <p class="section-title">Verificación en dos pasos</p>
          <p class="section-subtitle">Ingresá el código de 6 dígitos que enviamos a <strong id="twofaEmail"></strong></p>
        </div>
        <form id="twofaForm">
          <div class="form-group">
            <input type="text" class="code" id="twofaCode" maxlength="6" placeholder="000000" inputmode="numeric" required>
          </div>
          <button type="submit" class="btn btn-primary" id="twofaBtn">Verificar código</button>
          <p id="twofaError" class="error small text-center mt-2 hidden"></p>
        </form>
        <button class="btn btn-outline mt-3" id="twofaBackBtn">Volver al inicio</button>
      </div>

      <!-- RESET VIEW (code + new password) -->
      <div id="view-reset" class="hidden">
        <div class="text-center">
          <div class="icon-box">
            <svg fill="none" viewBox="0 0 24 24" stroke="#2563eb" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
          </div>
          <p class="section-title">Nueva contraseña</p>
          <p class="section-subtitle">Ingresá el código que enviamos a <strong id="resetEmailDisplay"></strong> y tu nueva contraseña.</p>
        </div>
        <form id="resetForm">
          <div class="form-group">
            <input type="text" class="code" id="resetCode" maxlength="6" placeholder="000000" inputmode="numeric" required>
          </div>
          <div class="form-group">
            <input type="password" id="resetPassword" placeholder="Nueva contraseña (mín. 8 caracteres)" minlength="8" required>
          </div>
          <div class="form-group">
            <input type="password" id="resetPasswordConfirm" placeholder="Confirmar contraseña" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary" id="resetBtn">Restablecer contraseña</button>
          <p id="resetSuccess" class="success small text-center mt-2 hidden"></p>
          <p id="resetError" class="error small text-center mt-2 hidden"></p>
        </form>
        <button class="btn btn-outline mt-3" id="resetBackBtn">Volver al inicio</button>
      </div>
    </div>
  </div>

  <script>
    const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

    function showView(view) {
      document.getElementById('view-login').classList.toggle('hidden', view !== 'login');
      document.getElementById('view-forgot').classList.toggle('hidden', view !== 'forgot');
      document.getElementById('view-2fa').classList.toggle('hidden', view !== '2fa');
      document.getElementById('view-reset').classList.toggle('hidden', view !== 'reset');
    }

    function $(id) { return document.getElementById(id); }

    function setLoading(btnId, loading, text) {
      const btn = $(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Procesando…' : text;
    }

    function showMsg(id, msg, isError) {
      const el = $(id);
      if (msg) {
        el.textContent = msg;
        el.classList.remove('hidden');
        el.className = (isError ? 'error' : 'success') + ' small text-center mt-2';
      } else {
        el.classList.add('hidden');
      }
    }

    // Init: check token
    (function init() {
      if (localStorage.getItem('auth_token')) {
        window.location.href = 'dashboard.html';
        return;
      }
      showView('login');
    })();

    // ---- LOGIN ----
    $('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = $('loginEmail').value.trim();
      const password = $('loginPassword').value;
      if (!email || !password) return;
      setLoading('loginBtn', true, 'Ingresando…');
      showMsg('loginError', null);
      showMsg('loginSuccessMsg', null);
      fetch(apiBase + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(r => r.json())
      .then(data => {
        setLoading('loginBtn', false, 'Ingresar');
        if (data.requires_2fa) {
          $('twofaEmail').textContent = data.email;
          $('twofaCode').value = '';
          $('twofaCode').dataset.tempToken = data.temp_token;
          showMsg('twofaError', null);
          showView('2fa');
        } else if (data.token) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user_name', data.user.nombre_negocio);
          localStorage.setItem('user_role', data.user.role);
          window.location.href = 'dashboard.html';
        } else {
          showMsg('loginError', data.message || 'Error al iniciar sesión.', true);
        }
      })
      .catch(function() { setLoading('loginBtn', false, 'Ingresar'); showMsg('loginError', 'Error de conexión.', true); });
    });

    // ---- 2FA ----
    $('twofaForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var code = $('twofaCode').value.trim();
      var tempToken = $('twofaCode').dataset.tempToken;
      if (!code || code.length !== 6 || !tempToken) return;
      setLoading('twofaBtn', true, 'Verificando…');
      showMsg('twofaError', null);
      fetch(apiBase + '/api/verify-2fa-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ temp_token: tempToken, code: code })
      })
      .then(r => r.json())
      .then(data => {
        setLoading('twofaBtn', false, 'Verificar código');
        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user_name', data.user.nombre_negocio);
          localStorage.setItem('user_role', data.user.role);
          window.location.href = 'dashboard.html';
        } else {
          showMsg('twofaError', data.message || 'Código incorrecto.', true);
        }
      })
      .catch(function() { setLoading('twofaBtn', false, 'Verificar código'); showMsg('twofaError', 'Error de conexión.', true); });
    });

    $('twofaBackBtn').addEventListener('click', function() { showView('login'); });

    $('showForgotBtn').addEventListener('click', function() {
      $('forgotEmail').value = '';
      showMsg('forgotSuccess', null);
      showMsg('forgotError', null);
      showView('forgot');
    });

    // ---- FORGOT PASSWORD ----
    $('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = $('forgotEmail').value.trim();
      if (!email) return;
      setLoading('forgotBtn', true, 'Enviando…');
      showMsg('forgotSuccess', null);
      showMsg('forgotError', null);
      fetch(apiBase + '/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
      .then(r => r.json().then(data => ({ ok: r.ok, data: data })))
      .then(function(result) {
        setLoading('forgotBtn', false, 'Enviar código');
        if (result.ok) {
          showMsg('forgotSuccess', result.data.message, false);
          $('resetEmailDisplay').textContent = email;
          $('resetCode').value = '';
          $('resetPassword').value = '';
          $('resetPasswordConfirm').value = '';
          showMsg('resetSuccess', null);
          showMsg('resetError', null);
          showView('reset');
        } else {
          showMsg('forgotError', result.data.message, true);
        }
      })
      .catch(function(err) { setLoading('forgotBtn', false, 'Enviar código'); showMsg('forgotError', 'Error de conexión: ' + err.message, true); });
    });

    $('forgotBackBtn').addEventListener('click', function() { showView('login'); });

    // ---- RESET PASSWORD ----
    $('resetForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const code = $('resetCode').value.trim();
      const password = $('resetPassword').value;
      const confirm = $('resetPasswordConfirm').value;
      if (!code || !password || !confirm) return;
      if (password !== confirm) { showMsg('resetError', 'Las contraseñas no coinciden.', true); return; }
      if (password.length < 8) { showMsg('resetError', 'La contraseña debe tener al menos 8 caracteres.', true); return; }
      setLoading('resetBtn', true, 'Restableciendo…');
      showMsg('resetSuccess', null);
      showMsg('resetError', null);
      fetch(apiBase + '/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: $('forgotEmail').value.trim(),
          code: code,
          password: password,
          password_confirmation: confirm
        })
      })
      .then(r => r.json().then(data => ({ ok: r.ok, data: data })))
      .then(function(result) {
        setLoading('resetBtn', false, 'Restablecer contraseña');
        if (result.ok) {
          $('loginEmail').value = $('forgotEmail').value.trim();
          showMsg('loginSuccessMsg', result.data.message + ' Iniciá sesión con tu nueva contraseña.', false);
          $('loginPassword').value = '';
          showMsg('loginError', null);
          showView('login');
        } else {
          showMsg('resetError', result.data.message, true);
        }
      })
      .catch(function() { setLoading('resetBtn', false, 'Restablecer contraseña'); showMsg('resetError', 'Error de conexión.', true); });
    });

    $('resetBackBtn').addEventListener('click', function() { showView('login'); });
  </script>
</body>
</html>

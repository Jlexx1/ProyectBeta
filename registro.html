<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALDIA - Crear Cuenta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrapper { width: 100%; max-width: 440px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 40px 32px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo h2 { font-size: 24px; font-weight: 800; }
    .logo p { color: #64748b; font-size: 13px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
    input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: border-color .2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .input-group { display: flex; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; transition: border-color .2s; }
    .input-group:focus-within { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .input-group input { border: none; border-radius: 0; }
    .input-group input:focus { box-shadow: none; }
    .input-group-text { display: flex; align-items: center; padding: 0 12px; background: #f8fafc; font-family: monospace; font-size: 12px; color: #94a3b8; border-left: 1px solid #e2e8f0; white-space: nowrap; }
    .btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-outline { background: transparent; color: #334155; border: 1px solid #cbd5e1; }
    .btn-outline:hover:not(:disabled) { background: #f8fafc; }
    .text-center { text-align: center; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 16px; }
    .small { font-size: 13px; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    .muted { color: #94a3b8; }
    .hidden { display: none; }
    .flex { display: flex; align-items: center; gap: 4px; }
    .flex-wrap { flex-wrap: wrap; }
    .gap-1 { gap: 4px; }
    .bar { height: 4px; flex: 1; border-radius: 2px; transition: background .2s; }
    .bar-1 { background: #fecaca; }
    .bar-2 { background: #fed7aa; }
    .bar-3 { background: #a7f3d0; }
    .bar-4 { background: #6ee7b7; }
    .bar-empty { background: #e2e8f0; }
    a { color: #2563eb; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 40px; }
    .toggle-pw { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #94a3b8; }
    .toggle-pw:hover { color: #475569; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo">
        <svg width="72" height="72" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 16px">
          <rect x="14" y="58" width="6" height="22" rx="3" fill="#3399ff" opacity="0.35"/>
          <rect x="24" y="48" width="6" height="32" rx="3" fill="#3399ff" opacity="0.53"/>
          <rect x="34" y="36" width="6" height="44" rx="3" fill="#3399ff" opacity="0.71"/>
          <rect x="44" y="22" width="6" height="58" rx="3" fill="#3399ff" opacity="0.89"/>
          <path d="M54 22 L74 22 C79 22 83 26 83 31 L83 51 C83 56 79 60 74 60 L64 60" fill="none" stroke="#3399ff" stroke-width="7" stroke-linecap="round"/>
          <rect x="14" y="80" width="42" height="4" rx="2" fill="#3399ff"/>
        </svg>
        <h2>ALDIA</h2>
        <p>Creá tu cuenta gratis</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label>Nombre del negocio</label>
          <input type="text" id="nombreNegocio" placeholder="Ej: Kiosco Don Roque" required autofocus>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="tunombre@gmail.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
            <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Ver contraseña">
              <svg id="eyeOpen" viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M2.042 10C3.122 6.093 6.236 3.333 10 3.333c3.764 0 6.878 2.76 7.958 6.667-1.08 3.907-4.194 6.667-7.958 6.667-3.764 0-6.878-2.76-7.958-6.667Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
              <svg id="eyeClosed" viewBox="0 0 20 20" fill="none" width="18" height="18" class="hidden"><path d="M3.333 3.333 16.667 16.667M8.228 8.228A2.5 2.5 0 0 0 11.77 11.77M5.596 5.596C3.973 6.723 2.7 8.25 2.042 10c1.08 3.907 4.194 6.667 7.958 6.667a9.16 9.16 0 0 0 4.404-1.13M8.333 4.39A9.27 9.27 0 0 1 10 4.167c3.764 0 6.878 2.76 7.958 6.667a10.3 10.3 0 0 1-2.07 3.573" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="strengthBars" class="flex gap-1 mt-1 hidden">
            <div class="bar" id="bar1"></div>
            <div class="bar" id="bar2"></div>
            <div class="bar" id="bar3"></div>
            <div class="bar" id="bar4"></div>
          </div>
          <p id="strengthLabel" class="small muted mt-1"></p>
        </div>

        <div class="form-group">
          <label>Confirmar contraseña</label>
          <input type="password" id="passwordConfirm" placeholder="Repetí tu contraseña" minlength="8" required>
        </div>

        <div class="form-group">
          <label>Dirección de tu panel</label>
          <div class="input-group">
            <input type="text" id="subdominio" placeholder="mi-negocio" required>
            <span class="input-group-text">.aldia.app</span>
          </div>
          <p id="subdomMsg" class="small muted mt-1">Mínimo 3 caracteres.</p>
        </div>

        <label class="flex mt-2 mb-3" style="gap:8px;align-items:flex-start;font-size:13px;color:#94a3b8;cursor:pointer">
          <input type="checkbox" id="termsCheck" required style="margin-top:2px;width:auto;cursor:pointer">
          <span>Acepto los <a href="#" target="_blank">términos y condiciones</a> y la <a href="#" target="_blank">política de privacidad</a> de ALDIA.</span>
        </label>

        <p id="registerError" class="error small text-center mt-2 hidden"></p>
        <p id="registerSuccess" class="success small text-center mt-2 hidden"></p>

        <button type="submit" class="btn btn-primary mt-2" id="registerBtn">Crear mi cuenta gratis</button>
      </form>

      <p class="text-center small mt-3" style="color:#94a3b8">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </div>

  <script>
    const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

    function $(id) { return document.getElementById(id); }

    let subdomTimer = null;
    let subdomToken = 0;

    // ---- Toggle password visibility ----
    $('togglePw').addEventListener('click', function() {
      const pw = $('password');
      const isText = pw.type === 'text';
      pw.type = isText ? 'password' : 'text';
      $('eyeOpen').classList.toggle('hidden', !isText);
      $('eyeClosed').classList.toggle('hidden', isText);
    });

    // ---- Password strength ----
    $('password').addEventListener('input', function() {
      const p = this.value;
      const bars = ['bar1','bar2','bar3','bar4'];
      const classes = ['','bar-empty','bar-empty','bar-empty','bar-empty'];
      const labels = ['','Débil','Aceptable','Buena','Fuerte'];
      const colors = ['','#fecaca','#fed7aa','#a7f3d0','#6ee7b7'];
      let score = 0;
      if (p.length >= 8) score++;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
      if (/\d/.test(p)) score++;
      if (/[^A-Za-z0-9]/.test(p)) score++;

      if (!p) {
        $('strengthBars').classList.add('hidden');
        $('strengthLabel').textContent = '';
        return;
      }
      $('strengthBars').classList.remove('hidden');
      bars.forEach(function(id, i) {
        $('bar' + (i+1)).style.background = i < score ? colors[score] : '#e2e8f0';
      });
      $('strengthLabel').textContent = labels[score] || '';
      $('strengthLabel').style.color = colors[score] || '#94a3b8';
    });

    // ---- Subdomain auto-generate from business name ----
    $('nombreNegocio').addEventListener('input', function() {
      const slug = slugify(this.value);
      if (slug) $('subdominio').value = slug;
      checkSubdominio();
    });

    $('subdominio').addEventListener('input', checkSubdominio);

    function slugify(text) {
      return text.toString()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .substring(0, 50);
    }

    function checkSubdominio() {
      const slug = slugify($('subdominio').value);
      clearTimeout(subdomTimer);
      const msg = $('subdomMsg');
      if (!slug) { msg.textContent = 'Mínimo 3 caracteres.'; msg.className = 'small muted mt-1'; return; }
      if (slug.length < 3) { msg.textContent = 'Mínimo 3 caracteres.'; msg.className = 'small muted mt-1'; return; }
      msg.textContent = 'Verificando disponibilidad…';
      msg.className = 'small muted mt-1';
      const token = ++subdomToken;
      subdomTimer = setTimeout(function() {
        fetch(apiBase + '/api/check-subdominio?subdominio=' + encodeURIComponent(slug))
          .then(r => r.json())
          .then(function(data) {
            if (token !== subdomToken) return;
            if (data.disponible) {
              msg.textContent = '✓ ¡Disponible!';
              msg.className = 'small success mt-1';
            } else {
              msg.textContent = 'Ese subdominio ' + (data.motivo === 'reservado' ? 'está reservado' : 'ya está en uso') + '. Probá otro.';
              msg.className = 'small error mt-1';
            }
          })
          .catch(function() { if (token === subdomToken) { msg.textContent = 'Mínimo 3 caracteres.'; msg.className = 'small muted mt-1'; } });
      }, 400);
    }

    // ---- Submit ----
    $('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nombreNegocio = $('nombreNegocio').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;
      const passwordConfirm = $('passwordConfirm').value;
      const subdominio = slugify($('subdominio').value);
      const btn = $('registerBtn');

      if (!nombreNegocio || !email || !password || !subdominio) {
        $('registerError').textContent = 'Todos los campos son obligatorios.';
        $('registerError').classList.remove('hidden');
        return;
      }
      if (password !== passwordConfirm) {
        $('registerError').textContent = 'Las contraseñas no coinciden.';
        $('registerError').classList.remove('hidden');
        return;
      }
      if (password.length < 8) {
        $('registerError').textContent = 'La contraseña debe tener al menos 8 caracteres.';
        $('registerError').classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando tu cuenta…';
      $('registerError').classList.add('hidden');
      $('registerSuccess').classList.add('hidden');

      fetch(apiBase + '/api/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nombre_negocio: nombreNegocio,
          email: email,
          password: password,
          password_confirmation: passwordConfirm,
          subdominio: subdominio
        })
      })
      .then(r => r.json())
      .then(function(data) {
        btn.disabled = false;
        btn.textContent = 'Crear mi cuenta gratis';
        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user_name', data.user.nombre_negocio);
          localStorage.setItem('user_role', data.user.role);
          window.location.href = 'dashboard.html';
        } else {
          $('registerError').textContent = data.message || 'Error al crear la cuenta.';
          $('registerError').classList.remove('hidden');
        }
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'Crear mi cuenta gratis';
        $('registerError').textContent = 'Error de conexión con el servidor.';
        $('registerError').classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
